[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoalign-data"
version = "0.1.0a1"
description = "Bilateral SMPL endpoint alignment and causal SONIC replay data"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "pandas", "pyarrow"]

[project.optional-dependencies]
test = ["pytest"]
simulation = ["mujoco", "av"]
data = ["datasets", "opencv-python", "onnxruntime", "av", "tqdm", "h5py", "torchvision", "Pillow", "huggingface-hub"]

[project.scripts]
egoalign-data = "egoalign.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["egoalign*", "scripts*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
