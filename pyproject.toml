[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda0-vla"
version = "0.1.0"
description = "VLM-conditioned velocity-flow action policies"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "transformers==5.14.1",
  "accelerate==1.14.0", "av==15.0.0", "numpy==1.26.3", "pyarrow==20.0.0",
  "Pillow==12.2.0", "mmengine==0.10.5", "einops==0.8.1",
  "safetensors==0.8.0", "packaging>=24,<27", "tensorboard==2.21.0"
]

[project.optional-dependencies]
serve = ["fastapi==0.141.1", "uvicorn==0.34.3", "json_numpy==2.1.0", "opencv-python-headless==4.11.0.86"]
tracking = ["wandb==0.28.1"]
fast = ["flash-linear-attention==0.4.2", "fla-core==0.4.2", "causal-conv1d==1.5.0.post8", "ninja==1.13.0"]

[project.scripts]
lambda0 = "lambda0.__main__:main"

[tool.setuptools]
# Preserve import paths used by released metadata and CLI commands during the
# source-layout migration. Each module is installed once, under its legacy name.
packages = ["lambda0", "lambda0.data", "lambda0.data.domain_handler",
            "lambda0.models", "lambda0.training", "lambda0.inference",
            "lambda0.evaluation", "lambda0.runtime"]
package-dir = {lambda0 = "src/openlambda"}

[tool.setuptools.package-data]
lambda0 = ["recipes/*.json"]
